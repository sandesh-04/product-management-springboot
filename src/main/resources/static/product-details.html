<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <a href="search-product.html" class="back-btn">
        ← Back to Search
    </a>

    <div class="header">
        <h1>Product Details</h1>
        <p>Details of the selected product</p>
    </div>

    <div class="product-details" id="productDetails">

        <div class="detail-row">
            <strong>ID:</strong>
            <span id="productId"></span>
        </div>

        <div class="detail-row">
            <strong>Name:</strong>
            <span id="productName"></span>
        </div>

        <div class="detail-row">
            <strong>Description:</strong>
            <span id="productDescription"></span>
        </div>

        <div class="detail-row">
            <strong>Price:</strong>
            ₹<span id="productPrice"></span>
        </div>

        <div class="detail-row">
            <strong>Photo URL:</strong>
            <span id="productPhotoUrl"></span>
        </div>

    </div>

    <div id="message" class="message"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const id = params.get("id");

if (!id) {

    showMessage("Product ID is missing.", "error");

} else {

    fetch(`/viewProduct/${id}`)

        .then(response => {

            if (!response.ok) {
                throw new Error("Product not found.");
            }

            return response.json();

        })

        .then(product => {

            document.getElementById("productId").innerText = product.id;
            document.getElementById("productName").innerText = product.name;
            document.getElementById("productDescription").innerText = product.description;
            document.getElementById("productPrice").innerText = product.price;
            document.getElementById("productPhotoUrl").innerText = product.photoUrl;

        })

        .catch(error => {

            showMessage(error.message, "error");

        });

}

function showMessage(message, type) {

    const messageBox = document.getElementById("message");

    messageBox.style.display = "block";
    messageBox.className = `message ${type}`;
    messageBox.innerText = message;

}

</script>

</body>
</html>
